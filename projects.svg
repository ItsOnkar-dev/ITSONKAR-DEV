<svg width="100%" viewBox="0 0 660 270" xmlns="http://www.w3.org/2000/svg">
  <title>Project cards — SnapCart, AuthForge, What's Next</title>
  <desc>Three centered project cards</desc>
  <style>
    .bg { fill: #0d1117; }
    .card { fill: #161b22; stroke: #30363d; stroke-width: 1; }
    .title { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size: 13px; font-weight: 600; fill: #e6edf3; }
    .desc { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size: 10.5px; fill: #8b949e; }
    .btn { font-family: "Segoe UI",sans-serif; font-size: 10px; font-weight: 600; }
    .stack-tag { font-family: "Segoe UI",sans-serif; font-size: 9px; font-weight: 500; }
    .img-placeholder { fill: #0d1117; stroke: #30363d; stroke-width: 1; stroke-dasharray: 4 2; }
    .img-label { font-family: "Segoe UI",sans-serif; font-size: 9px; fill: #484f58; }
  </style>
  <rect width="660" height="270" class="bg"/>

  <!-- CARD 1: SnapCart -->
  <rect x="10" y="10" width="200" height="250" rx="10" class="card"/>
  <rect x="10" y="10" width="200" height="3" rx="2" fill="#F75C7E"/>
  <image href="https://dev-to-uploads.s3.us-east-2.amazonaws.com/uploads/articles/40zokhq6lrobdho4diwj.png" x="20" y="20" width="180" height="76" preserveAspectRatio="xMidYMid slice"/>
  <text x="110" y="133" text-anchor="middle" class="title">SnapCart</text>
  <text x="110" y="147" text-anchor="middle" class="desc">Multi-vendor e-commerce</text>
  <line x1="25" y1="156" x2="195" y2="156" stroke="#21262d" stroke-width="0.8"/>
  <text x="110" y="170" text-anchor="middle" class="desc">MERN + TypeScript platform</text>
  <text x="110" y="183" text-anchor="middle" class="desc">with multi-vendor support</text>
  <rect x="32" y="191" width="34" height="14" rx="4" fill="#0d2137" stroke="#1f6feb" stroke-width="0.5"/>
  <text x="49" y="201" text-anchor="middle" class="stack-tag" fill="#58a6ff">React</text>
  <rect x="72" y="191" width="30" height="14" rx="4" fill="#0d2137" stroke="#1f6feb" stroke-width="0.5"/>
  <text x="87" y="201" text-anchor="middle" class="stack-tag" fill="#58a6ff">Node</text>
  <rect x="108" y="191" width="22" height="14" rx="4" fill="#0d2137" stroke="#1f6feb" stroke-width="0.5"/>
  <text x="119" y="201" text-anchor="middle" class="stack-tag" fill="#58a6ff">TS</text>
  <rect x="136" y="191" width="38" height="14" rx="4" fill="#0d2137" stroke="#1f6feb" stroke-width="0.5"/>
  <text x="155" y="201" text-anchor="middle" class="stack-tag" fill="#58a6ff">Mongo</text>
  <a href="https://github.com/ItsOnkar-dev/SnapCart-Ecom-Project">
    <rect x="22" y="212" width="80" height="22" rx="5" fill="#F75C7E"/>
    <text x="62" y="227" text-anchor="middle" class="btn" fill="#fff">View Project</text>
  </a>
  <a href="https://snapcart-now.vercel.app/">
    <rect x="108" y="212" width="82" height="22" rx="5" fill="#da3633"/>
    <text x="149" y="227" text-anchor="middle" class="btn" fill="#fff">&#9899; Live Demo</text>
  </a>

  <!-- CARD 2: AuthForge -->
  <rect x="230" y="10" width="200" height="250" rx="10" class="card"/>
  <rect x="230" y="10" width="200" height="3" rx="2" fill="#3fb950"/>
  <image href="https://dev-to-uploads.s3.us-east-2.amazonaws.com/uploads/articles/2q9w1g9dchi65zbwjycw.png" x="240" y="20" width="180" height="76" preserveAspectRatio="xMidYMid slice"/>
  <text x="330" y="133" text-anchor="middle" class="title">Secure AuthForge</text>
  <text x="330" y="147" text-anchor="middle" class="desc">Production-ready auth system</text>
  <line x1="245" y1="156" x2="415" y2="156" stroke="#21262d" stroke-width="0.8"/>
  <text x="330" y="170" text-anchor="middle" class="desc">Secure MERN boilerplate with</text>
  <text x="330" y="183" text-anchor="middle" class="desc">JWT, OAuth2 and role guards</text>
  <rect x="248" y="191" width="30" height="14" rx="4" fill="#0f1f14" stroke="#3fb950" stroke-width="0.5"/>
  <text x="263" y="201" text-anchor="middle" class="stack-tag" fill="#3fb950">JWT</text>
  <rect x="284" y="191" width="40" height="14" rx="4" fill="#0f1f14" stroke="#3fb950" stroke-width="0.5"/>
  <text x="304" y="201" text-anchor="middle" class="stack-tag" fill="#3fb950">OAuth2</text>
  <rect x="330" y="191" width="46" height="14" rx="4" fill="#0f1f14" stroke="#3fb950" stroke-width="0.5"/>
  <text x="353" y="201" text-anchor="middle" class="stack-tag" fill="#3fb950">Express</text>
  <rect x="382" y="191" width="28" height="14" rx="4" fill="#0f1f14" stroke="#3fb950" stroke-width="0.5"/>
  <text x="396" y="201" text-anchor="middle" class="stack-tag" fill="#3fb950">TS</text>
  <a href="https://dev.to/onkar_karale/i-built-a-production-ready-mern-boilerplates-so-you-never-have-to-again-3gi7">
    <rect x="242" y="212" width="80" height="22" rx="5" fill="#F75C7E"/>
    <text x="282" y="227" text-anchor="middle" class="btn" fill="#fff">View Article</text>
  </a>
  <a href="https://secure-authforge-web.vercel.app/">
    <rect x="328" y="212" width="82" height="22" rx="5" fill="#da3633"/>
    <text x="369" y="227" text-anchor="middle" class="btn" fill="#fff">&#9899; Live Demo</text>
  </a>

  <!-- CARD 3: What's Next -->
  <rect x="450" y="10" width="200" height="250" rx="10" class="card"/>
  <rect x="450" y="10" width="200" height="3" rx="2" fill="#e3b341"/>
  <image href="https://user-images.githubusercontent.com/74038190/229223263-cf2e4b07-2615-4f87-9c38-e37600f8381a.gif" x="460" y="20" width="180" height="76" preserveAspectRatio="xMidYMid slice"/>
  <text x="550" y="133" text-anchor="middle" class="title">What's Next</text>
  <text x="550" y="147" text-anchor="middle" class="desc">Skills in active progress</text>
  <line x1="465" y1="156" x2="635" y2="156" stroke="#21262d" stroke-width="0.8"/>
  <text x="550" y="170" text-anchor="middle" class="desc">Deepening TypeScript, Python</text>
  <text x="550" y="183" text-anchor="middle" class="desc">backend and AI integrations</text>
  <rect x="462" y="191" width="44" height="14" rx="4" fill="#1a1500" stroke="#e3b341" stroke-width="0.5"/>
  <text x="484" y="201" text-anchor="middle" class="stack-tag" fill="#e3b341">Python</text>
  <rect x="512" y="191" width="22" height="14" rx="4" fill="#1a1500" stroke="#e3b341" stroke-width="0.5"/>
  <text x="523" y="201" text-anchor="middle" class="stack-tag" fill="#e3b341">TS</text>
  <rect x="540" y="191" width="34" height="14" rx="4" fill="#1a1500" stroke="#e3b341" stroke-width="0.5"/>
  <text x="557" y="201" text-anchor="middle" class="stack-tag" fill="#e3b341">LLM's</text>
  <rect x="580" y="191" width="40" height="14" rx="4" fill="#1a1500" stroke="#e3b341" stroke-width="0.5"/>
  <text x="600" y="201" text-anchor="middle" class="stack-tag" fill="#e3b341">AI Tools</text>
  <rect x="490" y="212" width="120" height="22" rx="11" fill="#1a1500" stroke="#e3b341" stroke-width="1"/>
  <text x="550" y="227" text-anchor="middle" class="btn" fill="#e3b341">&#9889; In Progress</text>
</svg>
